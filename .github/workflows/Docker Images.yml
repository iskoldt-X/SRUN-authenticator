name: Build and push Docker image

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release date
        run: |
          echo "RELEASE_DATE=$(date +%y.%m.%d)" >> ${GITHUB_ENV}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'iskoldt' }}
          password: ${{ secrets.SAVEBOT_TOKEN || secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Owner names
        run: |
          GITOWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')
          echo "GITOWNER=$GITOWNER" >> ${GITHUB_ENV}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ env.GITOWNER }}/srun-authenticator:latest
            ghcr.io/${{ env.GITOWNER }}/srun-authenticator:${{ env.RELEASE_DATE }}
            ${{ secrets.DOCKERHUB_USERNAME || 'iskoldt' }}/srunauthenticator:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'iskoldt' }}/srunauthenticator:${{ env.RELEASE_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
